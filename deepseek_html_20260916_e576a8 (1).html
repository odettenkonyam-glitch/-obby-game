      display: flex;
      justify-content: center;
      align-items: center;

    }
    .game-container {
      background: #1e293b;
      padding: 1.5rem 2rem 2rem;
      border-radius: 3rem 3rem 2rem 2rem;
      box-shadow: 0 20px 30px rgba(0,0,0,0.6), inset 0 0 0 2px #334155;
    }
    canvas {
      display: block;
      margin: 0 auto;
      border-radius: 24px;
      box-shadow: 0 0 0 4px #0b1120, 0 15px 25px rgba(0,0,0,0.5);
      cursor: pointer;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 1rem 0.5rem 0.2rem;
      color: #e2e8f0;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .hud span {
      background: #0b1120;
      padding: 0.4rem 1.2rem;
      border-radius: 40px;
      border: 1px solid #3b4b5e;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
      font-size: 1rem;
    }
    .hud .win-message {
      color: #facc15;
      text-shadow: 0 0 10px #eab308;
      background: #2d2a0e;
      border-color: #a16207;
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-top: 1rem;
      color: #94a3b8;
      font-weight: 500;
      font-size: 0.9rem;
    }
    .controls kbd {
      background: #1e293b;
      border-radius: 8px;
      padding: 0.2rem 0.7rem;
      border: 1px solid #475569;
      color: #f1f5f9;
      font-weight: 700;
    }
    button {
      background: #3b82f6;
      border: none;
      color: white;
      font-weight: 700;
      padding: 0.4rem 1.2rem;
      border-radius: 40px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.1s;
      box-shadow: 0 6px 0 #1e3a8a;
      transform: translateY(0);
      margin-left: 0.5rem;
    }
    button:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #1e3a8a;
    }
    .reset-container {
      display: flex;
      align-items: center;
    }
    .level-badge {
      background: #0b1120;
      padding: 0.4rem 1rem;
      border-radius: 40px;
      border: 1px solid #facc15;
      color: #facc15;
      font-weight: 700;
      margin-right: 0.5rem;
    }
  </style>
</head>

    // ---------- INPUT ----------
    const keys = { left: false, right: false, up: false };

    function handleKeyDown(e) {
      const key = e.key;
      if (key === 'ArrowLeft' || key === 'Left' || key === 'a' || key === 'A') {
        keys.left = true; e.preventDefault();
      } else if (key === 'ArrowRight' || key === 'Right' || key === 'd' || key === 'D') {
        keys.right = true; e.preventDefault();
      } else if (key === 'ArrowUp' || key === 'Up' || key === 'w' || key === 'W' || key === ' ') {
        if (!keys.up) attemptJump();
        keys.up = true; e.preventDefault();
      }
    }

    function handleKeyUp(e) {
      const key = e.key;
      if (key === 'ArrowLeft' || key === 'Left' || key === 'a' || key === 'A') {
        keys.left = false; e.preventDefault();
      } else if (key === 'ArrowRight' || key === 'Right' || key === 'd' || key === 'D') {
        keys.right = false; e.preventDefault();
      } else if (key === 'ArrowUp' || key === 'Up' || key === 'w' || key === 'W' || key === ' ') {
        keys.up = false; e.preventDefault();
      }
    }

    // ---------- DOUBLE JUMP ----------
    function attemptJump() {
      if (player.jumpsLeft > 0) {
        const isGroundJump = player.onGround;
        const force = isGroundJump ? JUMP_FORCE : DOUBLE_JUMP_FORCE;
        const jumpDir = currentGravity > 0 ? force : -force;
        player.vy = jumpDir;
        player.onGround = false;
        player.jumpsLeft--;
      }
    }

    window.addEventListener('keydown', handleKeyDown);
    window.addEventListener('keyup', handleKeyUp);

    // ---------- LOAD LEVEL ----------
    function loadLevel(index) {
      const level = levels[index];
      currentPlatforms = level.platforms.map(p => ({
        ...p,
        origX: p.x,
        origY: p.y,
        currentX: p.x,
        currentY: p.y,
        fade: 1,
        fadeState: 'idle',
        fadeProgress: 0,
        fakeTimer: 0,
        fakeTriggered: false,
      }));
      currentGoal = { ...level.goal };
      currentSpawn = { ...level.spawn };
      currentGravity = level.gravityFlip ? -GRAVITY : GRAVITY;

      fakePlatforms = [];
      triggeredFakes = new Set();
      movingPlatforms = [];
      invisiblePlatforms = [];
      ghostGoal = !!level.runawayGoal;
      goalOffsetX = 0;
      goalOffsetY = 0;
      goalOriginal = { x: currentGoal.x, y: currentGoal.y };
      respawnCooldown = 0;

      currentPlatforms.forEach((p, i) => {
        if (p.fake) fakePlatforms.push(i);
        if (p.moveX || p.moveY) movingPlatforms.push(i);
        if (p.invisible) invisiblePlatforms.push(i);
      });

      player.x = currentSpawn.x;
      player.y = currentSpawn.y;
      player.vx = 0;
      player.vy = 0;
      player.onGround = false;
      player.jumpsLeft = 2;
      frameCounter = 0;

      levelDisplay.textContent = `${index + 1} / ${levels.length}`;
      messageEl.textContent = '⬆️ jump ⬅️➡️';
      messageEl.classList.remove('win-message');
      messageEl.style.color = '#e2e8f0';
    }

    // ---------- RESPAWN ----------

      player.vx = 0;
      player.vy = 0;
      player.onGround = false;

      goalOffsetY = 0;
      currentGoal.x = goalOriginal.x;
      currentGoal.y = goalOriginal.y;

      currentPlatforms.forEach(p => {
        if (p.fake) {
          p.fadeState = 'refilling';
          p.fade = 0;
          p.fadeProgress = 0;
          p.fakeTimer = 0;
          p.fakeTriggered = false;
        }
      });
      triggeredFakes.clear();

      messageEl.textContent = '💥 try again';
      setTimeout(() => {
        if (messageEl.textContent === '💥 try again') {
          messageEl.textContent = '⬆️ jump ⬅️➡️';
        }
      }, 700);
    }

    // ---------- NEXT LEVEL ----------
    function goToNextLevel() {
      if (goalCooldown) return;
      goalCooldown = true;

      if (currentLevelIndex + 1 < levels.length) {
        currentLevelIndex++;
        loadLevel(currentLevelIndex);
        messageEl.textContent = '🚀 NEXT LEVEL!';
        messageEl.classList.add('win-message');
        setTimeout(() => {
          if (messageEl.textContent === '🚀 NEXT LEVEL!') {
            messageEl.textContent = '⬆️ jump ⬅️➡️';
            messageEl.classList.remove('win-message');
          }
        }, 900);
      } else {
        currentLevelIndex = 0;
        loadLevel(0);
        messageEl.textContent = '🎉 ALL 20 LEVELS COMPLETE! 🎉';
        messageEl.classList.add('win-message');
        setTimeout(() => {
          messageEl.textContent = '⬆️ jump ⬅️➡️';
          messageEl.classList.remove('win-message');
        }, 3000);
      }
      setTimeout(() => { goalCooldown = false; }, 300);
    }

    function resetGame() {
      currentLevelIndex = 0;
      goalCooldown = false;
      loadLevel(0);
    }

    document.getElementById('resetBtn').addEventListener('click', resetGame);

    // ---------- HELPERS ----------
    function isPlatformVisible(p, idx) {
      if (p.invisible) {
        const dx = Math.abs((player.x + player.width / 2) - (p.currentX + p.w / 2));
        const dy = Math.abs((player.y + player.height / 2) - (p.currentY + p.h / 2));
        return dx < 130 && dy < 130;
      }
      return true;
    }

    function isPlatformSolid(idx) {
      if (triggeredFakes.has('fake_' + idx)) return false;
      return true;
    }

    // ---------- PHYSICS ----------
    function applyPhysics() {
      frameCounter++;
      if (respawnCooldown > 0) respawnCooldown--;

      // Update moving platforms
      currentPlatforms.forEach((p) => {
        if (p.moveX) {
          p.currentX = p.origX + Math.sin(frameCounter * (p.speed || 0.02)) * p.moveX;
          p.x = p.currentX;
        }
        if (p.moveY) {
          p.currentY = p.origY + Math.sin(frameCounter * (p.speed || 0.02)) * p.moveY;
          p.y = p.currentY;
        }
      });

      // Tick fake platform timers
      currentPlatforms.forEach((p, i) => {
        if (p.fake && p.fakeTriggered && !triggeredFakes.has('fake_' + i)) {
          p.fakeTimer--;
          if (p.fakeTimer <= 0) {
            triggeredFakes.add('fake_' + i);
            p.fadeState = 'idle';
            p.fade = 1;
          }
        }
      });

      // Fade-in animation
      currentPlatforms.forEach((p) => {
        if (p.fadeState === 'refilling') {
          p.fadeProgress += 0.015;
          if (p.fadeProgress >= 1) {
            p.fadeProgress = 1;
            p.fade = 1;
            p.fadeState = 'idle';
          } else {
            p.fade = p.fadeProgress;
          }
        }
      });

      // ---------- RUNAWAY GOAL (returns home!) ----------
      if (ghostGoal) {
        const dx = player.x - currentGoal.x;
        const dy = player.y - currentGoal.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < 180 && dist > 0.1) {
          // Player is close → run away
          goalOffsetX -= (dx / dist) * 1.2;
          goalOffsetY -= (dy / dist) * 1.2;
        } else {
          // Player is far → drift back toward original position
          goalOffsetX *= 0.95;
          goalOffsetY *= 0.95;
          if (Math.abs(goalOffsetX) < 0.5) goalOffsetX = 0;
          if (Math.abs(goalOffsetY) < 0.5) goalOffsetY = 0;
        }

        goalOffsetX = Math.max(-250, Math.min(250, goalOffsetX));
        goalOffsetY = Math.max(-200, Math.min(200, goalOffsetY));
        currentGoal.x = goalOriginal.x + goalOffsetX;
        currentGoal.y = goalOriginal.y + goalOffsetY;
      }

      // Horizontal
      if (keys.left) player.vx = -MOVE_SPEED;
      else if (keys.right) player.vx = MOVE_SPEED;
      else player.vx = 0;

      // Gravity
      player.vy += currentGravity;
      const maxV = 18;
      if (player.vy > maxV) player.vy = maxV;
      if (player.vy < -maxV) player.vy = -maxV;

      const prevX = player.x;
      const prevY = player.y;

      // Move X
      player.x += player.vx;
      if (player.x < 0) { player.x = 0; player.vx = 0; }
      if (player.x + player.width > W) { player.x = W - player.width; player.vx = 0; }

      // Move Y
      player.y += player.vy;
      const wasOnGround = player.onGround;
      player.onGround = false;

      // Collision
      for (let i = 0; i < currentPlatforms.length; i++) {
        const pl = currentPlatforms[i];
        if (!isPlatformSolid(i)) continue;
        if (pl.invisible && !isPlatformVisible(pl, i)) continue;

        const overlapX = player.x < pl.x + pl.w && player.x + player.width > pl.x;
        const overlapY = player.y < pl.y + pl.h && player.y + player.height > pl.y;

        if (overlapX && overlapY) {
          if (pl.fake && !pl.fakeTriggered) {
            pl.fakeTriggered = true;
            pl.fakeTimer = FAKE_DELAY_FRAMES;
            messageEl.textContent = '⏳ 5s...';
            setTimeout(() => {
              if (messageEl.textContent === '⏳ 5s...') {
                messageEl.textContent = '⬆️ jump ⬅️➡️';
              }
            }, 1200);
          }

          const prevOverlapX = prevX < pl.x + pl.w && prevX + player.width > pl.x;
          const prevOverlapY = prevY < pl.y + pl.h && prevY + player.height > pl.y;

          if (!prevOverlapY) {
            if (currentGravity > 0) {
              if (prevY + player.height <= pl.y && player.vy >= 0) {
                player.y = pl.y - player.height;
                player.vy = 0;
                player.onGround = true;
              } else if (prevY >= pl.y + pl.h && player.vy < 0) {
                player.y = pl.y + pl.h;
                player.vy = 0;
              }
            } else {
              if (prevY >= pl.y + pl.h && player.vy <= 0) {
                player.y = pl.y + pl.h;
                player.vy = 0;
                player.onGround = true;
              } else if (prevY + player.height <= pl.y && player.vy > 0) {
                player.y = pl.y - player.height;
                player.vy = 0;
              }
            }
          } else if (!prevOverlapX) {
            if (prevX + player.width <= pl.x) player.x = pl.x - player.width;
            else if (prevX >= pl.x + pl.w) player.x = pl.x + pl.w;
            player.vx = 0;
          } else {
            if (currentGravity > 0) {
              if (player.vy > 0) {
                player.y = pl.y - player.height;
                player.vy = 0;
                player.onGround = true;
              } else if (player.vy < 0) {
                player.y = pl.y + pl.h;
                player.vy = 0;
              }
            } else {
              if (player.vy < 0) {
                player.y = pl.y + pl.h;
                player.vy = 0;
                player.onGround = true;
              } else if (player.vy > 0) {
                player.y = pl.y - player.height;
                player.vy = 0;
              }
            }
          }
        }
      }

      // Reset double jump on landing
      if (player.onGround && !wasOnGround) {
        player.jumpsLeft = 2;
      }
      if (player.onGround) {
        player.jumpsLeft = 2;
      }

      // Fall out
      if (currentGravity > 0 && player.y + player.height > H) {
        respawnPlayer();
      } else if (currentGravity < 0 && player.y < -50) {
        respawnPlayer();
      }

      // Goal
      const playerBottom = player.y + player.height;
      const playerRight = player.x + player.width;
      const horizontallyOver = playerRight > currentGoal.x && player.x < currentGoal.x + currentGoal.w;
      const verticallyOnGoal = playerBottom >= currentGoal.y && player.y <= currentGoal.y + currentGoal.h;

      if (horizontallyOver && verticallyOnGoal) {
        goToNextLevel();
      }
    }

    // ---------- DRAWING ----------
    function draw() {
      ctx.clearRect(0, 0, W, H);

      const hue = (currentLevelIndex * 18) % 360;
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, `hsl(${210 + hue}, 40%, 10%)`);
      grad.addColorStop(0.7, `hsl(${210 + hue}, 30%, 18%)`);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = '#ffffff30';
      for (let i = 0; i < 60; i++) {
        const sx = (i * 131 + currentLevelIndex * 13) % W;
        const sy = (i * 279) % (H * 0.6);
        ctx.beginPath();
        ctx.arc(sx, sy, 1.5, 0, Math.PI * 2);
        ctx.fill();
      }

      // Platforms
      for (let i = 0; i < currentPlatforms.length; i++) {
        const pl = currentPlatforms[i];

        if (pl.fake && triggeredFakes.has('fake_' + i)) {
          if (pl.fadeState === 'refilling') {
            ctx.globalAlpha = pl.fade;
          } else {
            continue;
          }
        } else if (pl.invisible && !isPlatformVisible(pl, i)) {
          continue;
        }

        let baseColor = '#2e3f4f';
        let topColor = '#5f7e9c';
        let botColor = '#1e2b38';

        if (pl.fake && pl.fakeTriggered) {
          const t = pl.fakeTimer / FAKE_DELAY_FRAMES;
          const warning = 1 - t;
          if (warning > 0.4) {
            const r = Math.floor(46 + warning * 150);
            const g = Math.floor(63 - warning * 40);
            const b = Math.floor(79 - warning * 40);
            baseColor = `rgb(${r}, ${g}, ${b})`;
            topColor = `rgb(${Math.floor(95 + warning * 100)}, ${Math.floor(126 - warning * 80)}, ${Math.floor(156 - warning * 80)})`;
          }
        }

        ctx.fillStyle = baseColor;
        ctx.shadowColor = '#00000050';
        ctx.shadowBlur = 12;
        ctx.shadowOffsetY = 4;
        ctx.beginPath();
        ctx.roundRect(pl.x, pl.y, pl.w, pl.h, 8);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;
        ctx.fillStyle = topColor;
        ctx.beginPath();
        ctx.roundRect(pl.x, pl.y, pl.w, 4, 6);
        ctx.fill();

        ctx.fillStyle = botColor;
        ctx.beginPath();
        ctx.roundRect(pl.x, pl.y + pl.h - 4, pl.w, 4, 6);
        ctx.fill();

        if (pl.fake && pl.fakeTriggered && !triggeredFakes.has('fake_' + i)) {
          const secondsLeft = Math.ceil(pl.fakeTimer / 60);
          ctx.font = 'bold 14px "Segoe UI", sans-serif';
          ctx.fillStyle = '#fef08a';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(secondsLeft + 's', pl.x + pl.w / 2, pl.y - 12);
        }

        ctx.globalAlpha = 1;
      }

      // Goal (with a subtle "home" marker)
      if (ghostGoal) {
        // Draw the "home" position as a faint outline
        ctx.strokeStyle = '#eab30830';
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 5]);
        ctx.strokeRect(goalOriginal.x, goalOriginal.y, currentGoal.w, currentGoal.h);
        ctx.setLineDash([]);
      }

      ctx.shadowBlur = 25;
      ctx.shadowColor = '#eab308';
      ctx.fillStyle = '#facc15';
      ctx.beginPath();
      ctx.roundRect(currentGoal.x, currentGoal.y, currentGoal.w, currentGoal.h, 8);
      ctx.fill();
      ctx.shadowBlur = 10;
      ctx.fillStyle = '#fef9c3';
      ctx.beginPath();
      ctx.arc(currentGoal.x + currentGoal.w / 2, currentGoal.y - 8, 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#b45309';
      ctx.font = 'bold 20px "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('★', currentGoal.x + currentGoal.w / 2, currentGoal.y - 8);
      ctx.shadowBlur = 0;
      ctx.shadowOffsetY = 0;

      // Player
      ctx.shadowBlur = 18;
      ctx.shadowColor = player.jumpsLeft > 1 ? '#38bdf8' : '#3b82f6';
      ctx.fillStyle = '#3b82f6';
      ctx.beginPath();
      ctx.roundRect(player.x, player.y, player.width, player.height, 10);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#0f172a';
      ctx.beginPath(); ctx.arc(player.x + 9, player.y + 11, 4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(player.x + 21, player.y + 11, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(player.x + 7, player.y + 9, 1.8, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(player.x + 19, player.y + 9, 1.8, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath();
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 2.5;
      ctx.arc(player.x + 15, player.y + 19, 6, 0.1, Math.PI - 0.1);
      ctx.stroke();

      // Double jump indicator
      const dotY = currentGravity > 0 ? player.y - 12 : player.y + player.height + 12;
      for (let d = 0; d < 2; d++) {
        ctx.fillStyle = d < player.jumpsLeft ? '#38bdf8' : '#1e293b';
        ctx.shadowBlur = d < player.jumpsLeft ? 8 : 0;
        ctx.shadowColor = '#38bdf8';
        ctx.beginPath();
        ctx.arc(player.x + 10 + d * 11, dotY, 3, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;

      // HUD
      ctx.font = 'bold 14px "Segoe UI", monospace';
      ctx.fillStyle = '#94a3b8';
      ctx.textAlign = 'right';
      ctx.fillText(`LEVEL ${currentLevelIndex + 1}/${levels.length}`, W - 20, 40);

      // Progress bar
      const barW = 200;
      const barX = W - barW - 20;
      const barY = 55;
      ctx.fillStyle = '#0b1120';
      ctx.fillRect(barX, barY, barW, 6);
      ctx.fillStyle = '#facc15';
      ctx.fillRect(barX, barY, barW * (currentLevelIndex / (levels.length - 1)), 6);

      // Goal hint
      ctx.fillStyle = '#facc1550';
      ctx.font = 'bold 18px "Segoe UI"';
      ctx.textAlign = 'center';
      ctx.fillText('→ goal →', currentGoal.x + currentGoal.w / 2, currentGoal.y - 40);
    }

    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
      if (w < 2 * r) r = w / 2;
      if (h < 2 * r) r = h / 2;
      this.moveTo(x + r, y);
      this.lineTo(x + w - r, y);
      this.quadraticCurveTo(x + w, y, x + w, y + r);
      this.lineTo(x + w, y + h - r);
      this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      this.lineTo(x + r, y + h);
      this.quadraticCurveTo(x, y + h, x, y + h - r);
      this.lineTo(x, y + r);
      this.quadraticCurveTo(x, y, x + r, y);
      return this;
    };

    // ---------- LOOP ----------
    function gameLoop() {
      applyPhysics();
      draw();
      requestAnimationFrame(gameLoop);
    }

    resetGame();
    gameLoop();

    window.addEventListener('blur', () => {
      keys.left = false; keys.right = false; keys.up = false;
    });

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Space'].includes(e.key)) {
        e.preventDefault();
      }
    }, { passive: false });

  })();
</script>
</body>
